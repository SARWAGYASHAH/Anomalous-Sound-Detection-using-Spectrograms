# ============================================================
# default.yaml - Base configuration for Anomalous Sound Detection
# All pipeline scripts load this as the base config.
# Override specific values with experiment-specific YAML files.
# ============================================================

# ---------- Project ----------
project:
  name: "anomalous-sound-detection"
  description: "Autoencoder-based anomaly detection on industrial machine sounds"
  version: "0.1.0"

# ---------- Reproducibility ----------
seed: 42

# ---------- Data Paths ----------
data:
  raw_dir: "Data/raw"
  processed_dir: "Data/processed"
  zip_file: "Data/dev_data_gearbox.zip"
  machine_type: "gearbox"           # Target machine type
  train_split: 0.8                  # 80% train, 20% validation

# ---------- Audio Processing ----------
audio:
  sample_rate: 16000                # Hz
  duration: 10                      # seconds per clip
  mono: true                        # Convert to mono

# ---------- Spectrogram ----------
spectrogram:
  type: "mel"                       # "mel" | "stft" | "mfcc"
  n_fft: 1024                       # FFT window size
  hop_length: 512                   # Hop between frames
  n_mels: 128                       # Number of mel bands (for mel spectrograms)
  power: 2.0                        # Power for spectrogram magnitude
  normalize: true                   # Normalize spectrograms
  normalization_mode: "global_minmax"    # Keep mel spectrograms in [0, 1] for sigmoid + SSIM loss
  stats_path: "artifacts/preprocessing/spectrogram_stats.json"
  reuse_stats: false                # Recompute stats during preprocessing unless explicitly reused

# ---------- Model ----------
model:
  type: "autoencoder"               # "autoencoder" | future models
  autoencoder:
    input_dim: 128                  # Must match n_mels
    input_time_frames: 320          # Expected spectrogram width
    latent_dim: 32                  # Dense bottleneck size; try 64 as the next sweep
    encoder_layers: [128, 64, 32]   # Encoder conv filters
    decoder_layers: [32, 64, 128]   # Decoder mirrors encoder channel-for-channel
    activation: "relu"              # "relu" | "leaky_relu" | "elu"
    dropout: 0.0                    # Backward-compatible default; prefer explicit rates below
    encoder_dropout: 0.1            # Light encoder regularization
    decoder_dropout: 0.2            # Stronger decoder regularization
    output_activation: "sigmoid"    # Matches [0, 1] normalized spectrograms

# ---------- Training ----------
training:
  epochs: 80
  batch_size: 16
  learning_rate: 0.0003
  weight_decay: 0.0001              # L2 regularization
  optimizer: "adam"                  # "adam" | "sgd" | "adamw"
  scheduler:
    type: "step"                    # "step" | "cosine" | "none"
    step_size: 15                   # StepLR: decay every N epochs
    gamma: 0.7                      # StepLR: multiplicative factor
  early_stopping:
    enabled: true
    patience: 15                    # Stop after N epochs with no improvement
    min_delta: 0.0001               # Minimum improvement threshold
  loss: "combined_mse_ssim"         # MSE + SSIM combined reconstruction loss

# ---------- Inference / Anomaly Detection ----------
inference:
  threshold_method: "mean_std"      # "percentile" | "mean_std" | "fixed"
  percentile: 95                    # For percentile-based threshold
  std_multiplier: 2.5               # threshold = mean_train_error + 2.5 * std_train_error
  fixed_threshold: null             # For fixed method
  reconstruction_score:
    method: "frequency_band_top_k"  # Compute errors per band, then aggregate
    top_k_fraction: 0.05            # Average worst 5% reconstruction errors
    frequency_bands: [[0.0, 0.25], [0.25, 0.5], [0.5, 0.75], [0.75, 1.0]]
    band_aggregation: "max"         # Let a localized frequency-band anomaly drive the score
  latent_scorer:
    pca_components: 32              # Latent PCA dimensions for Mahalanobis scoring
    covariance_regularization: 0.000001
    combined_weight: 0.5            # In combined mode, weight assigned to latent score
  classification:
    labels: ["normal", "follow_up", "alert"]
    boundaries: [0.5, 0.8]          # Score boundaries between labels

# ---------- Artifact Versioning ----------
versioning:
  mode: "auto"                      # "auto" (increment) | "manual" (from config)
  manual_version: null              # e.g., "v5" — used only when mode is "manual"
  base_dir: "artifacts/models"      # Where versioned model folders are saved

# ---------- Artifact Paths ----------
artifacts:
  models_dir: "artifacts/models"
  metadata_dir: "artifacts/metadata"
  logs_dir: "artifacts/logs"

# ---------- MLflow ----------
mlflow:
  enabled: true
  tracking_uri: "mlruns"            # Local directory (relative to project root)
  experiment_name: "gearbox_anomaly_detection"
  log_models: true                  # Log model artifacts to MLflow
  tags:
    machine_type: "gearbox"
    project: "anomalous-sound-detection"

# ---------- Logging ----------
logging:
  level: "INFO"                     # "DEBUG" | "INFO" | "WARNING" | "ERROR"
  console: true
  file: true                        # Write logs to artifacts/logs/
